# cargo-deny supply-chain policy. Verified against cargo-deny 0.20.2.
#
# The dependency tree is two cryptography crates (a password hash and a
# cipher) and what they bring. Each list is as short as that tree justifies:
# an entry that matches nothing makes `cargo deny check` warn on every run.

[advisories]
yanked = "deny"

[licenses]
# The crate's own expression, "MIT OR Apache-2.0"; the check covers it too.
allow = ["MIT", "Apache-2.0", "BSD-3-Clause"]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
